name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  # 允许从 Actions 标签页手动触发
  workflow_dispatch:

# 允许此工作流将页面部署到 GitHub Pages，并获取 OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署，跳过排队中的运行，但不取消正在进行的运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 7.33.7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      # --ignore-scripts 跳过 root 的 `prepare: dumi setup`：
      # 该步骤在 CI 中会显著拖慢安装，且有卡住的风险。
      # 代码质量门禁（lint / typecheck / test / build:lib / smoke）见 ci.yml。
      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build project
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传 dumi 构建产物目录
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
