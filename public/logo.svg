<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <linearGradient id="gem" x1="256" y1="80" x2="256" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="40%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="facet2" x1="256" y1="80" x2="256" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F3FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="facet3" x1="256" y1="80" x2="256" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EDE9FE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.6"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="spotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E9D5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- 光晕底层 -->
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>

  <!-- ===== 棱镜主体 ===== -->
  <!-- 顶点: (256, 80)  左: (108, 310)  右: (404, 310)  底: (256, 430) -->

  <!-- 左面 (最暗) -->
  <polygon points="256,80 108,310 256,430" fill="url(#facet3)"/>

  <!-- 右面 (中等) -->
  <polygon points="256,80 404,310 256,430" fill="url(#facet2)"/>

  <!-- 中脊 (最亮) -->
  <polygon points="256,80 108,310 404,310" fill="url(#gem)"/>

  <!-- 内部折射线 - 左 -->
  <line x1="256" y1="80" x2="168" y2="350" stroke="#FAF5FF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- 内部折射线 - 右 -->
  <line x1="256" y1="80" x2="344" y2="350" stroke="#FAF5FF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- 高光点 - 顶部 -->
  <circle cx="256" cy="120" r="18" fill="url(#spotGlow)"/>

  <!-- 高光点 - 左肩 -->
  <circle cx="196" cy="240" r="8" fill="#FAF5FF" opacity="0.15"/>

  <!-- 高光点 - 右肩 -->
  <circle cx="316" cy="240" r="6" fill="#FAF5FF" opacity="0.12"/>

  <!-- 底部边缘光 -->
  <line x1="108" y1="310" x2="404" y2="310" stroke="#C4B5FD" stroke-opacity="0.2" stroke-width="1"/>
</svg>
